# Cloudflare configuration for ZOL-OIL (Cloudflare Pages, nitro "cloudflare-pages").
#
# The app runs on Cloudflare D1 (data) + R2 (images). Resources are provisioned and
# bound below (database `zol-oil`, bucket `zol-oil-images`). Migrations live in
# migrations/d1 — apply with `wrangler d1 migrations apply zol-oil --remote`.
# See docs/CLOUDFLARE_DEPLOYMENT.md for the full sequence.

name = "zol-oil"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

pages_build_output_dir = "dist"

# The code reads env.DB and env.R2 — the binding NAMES must stay DB and R2.
[[d1_databases]]
binding = "DB"
database_name = "zol-oil"
database_id = "d8ae48c2-236f-4dd8-b3e6-76a37db62126"
migrations_dir = "migrations/d1"

[[r2_buckets]]
binding = "R2"
bucket_name = "zol-oil-images"

# Service binding to the private zol-oil-mailer Worker (workers/mailer), which owns
# the Email Routing send_email binding — Pages Functions can't hold one directly.
# Deploy the Worker first: npx wrangler deploy --config workers/mailer/wrangler.toml
[[services]]
binding = "MAILER"
service = "zol-oil-mailer"

[vars]
# Public, build-time vars (VITE_ prefix). Cloudflare Pages injects [vars] into the
# CI build, and Vite inlines any VITE_-prefixed value into the client bundle.
# Google Tag Manager container — tracking is consent-gated (Consent Mode v2);
# GA4 + Meta Pixel are configured as tags INSIDE GTM, not here.
VITE_GTM_ID = "GTM-K7TXVR2Q"
VITE_SITE_URL = "https://zoloil.ro"

# Canonical origin — DECIDED 2026-10-25: https://zoloil.ro (non-www, no trailing slash).
# Powers sitemap.xml, robots.txt, canonical/OG tags AND the www -> apex 301 in
# src/server.ts. VITE_SITE_URL is a BUILD-time var (Vite inlines it): it is set in the
# Cloudflare Pages dashboard (Settings -> Variables and Secrets, Production), where the
# old value https://www.zoloil.ro lived. Change it there; see docs/SEO_AUDIT_2026-10.md §5.

# Custom image-delivery base URL (attach a custom domain to the R2 bucket; no r2.dev in prod).
# Left unset for now → images are served same-origin via the /img/<key> route.
# R2_PUBLIC_BASE_URL = "https://img.zol-oil.ro"

# Secrets/vars (NOTIFY_EMAIL, NOTIFY_FROM, ACCESS_TEAM_DOMAIN, ACCESS_AUD,
# ADMIN_EMAILS) are set in the Pages dashboard / `.dev.vars`, not here.
# NOTIFY_EMAIL = comma-separated new-lead recipients; each must be a VERIFIED
# Email Routing destination address or delivery fails (logged in lead_notifications).
